[project]
name = "fastapi-auth-backend"
version = "0.1.0"
description = "A split-file token authentication system with MongoDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "motor>=3.3.2",
    "pymongo>=4.6.2",
    "bcrypt>=4.1.2",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
]